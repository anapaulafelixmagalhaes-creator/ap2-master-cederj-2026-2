icativos de edição colaborativa na nuvem e explique UMA funcionalidade de colaboração que eles oferecem.","example":"Ex.: Documentos Google e Planilhas Google. Permitem coedição em tempo real, comentários e compartilhamento com permissões de acesso.","criteria":["Citar dois aplicativos adequados.","Explicar funcionalidade concreta (coedição, comentários ou histórico)."],"topic":"Computação na nuvem","points":1,"visual":"collab"},{"type":"assoc","q":"Associação 1 de 4. Um programa registra secretamente hábitos de navegação e transmite informações a terceiros. A qual categoria pertence?","options":["Ransomware","Spyware","Firewall","Worm"],"ans":1,"why":"Spyware coleta ou monitora informações sem autorização adequada.","topic":"Malware · associação","points":0.5},{"type":"assoc","q":"Associação 2 de 4. Programa malicioso que criptografa ou bloqueia arquivos e exige pagamento para liberação.","options":["Adware","Worm","Ransomware","Cookie de sessão"],"ans":2,"why":"Ransomware é associado a extorsão por indisponibilidade de dados.","topic":"Malware · associação","points":0.5},{"type":"assoc","q":"Associação 3 de 4. Programa que se replica e se propaga entre máquinas/rede sem precisar anexar-se a um arquivo hospedeiro.","options":["Worm","Antivírus","Certificado digital","Spyware"],"ans":0,"why":"Worm pode se autopropagar por redes e explorar falhas.","topic":"Malware · associação","points":0.5},{"type":"assoc","q":"Associação 4 de 4. Programa que exibe anúncios indesejados, frequentemente de forma intrusiva.","options":["Planilha","Adware","Proxy seguro","Roteador"],"ans":1,"why":"Adware é software voltado à apresentação de publicidade, por vezes invasiva.","topic":"Malware · associação","points":0.5},{"type":"mc","q":"No Calc, A2 contém 7. Qual resultado da fórmula `=SE(A2>=6;\"APTO\";\"REVER\")`?","options":["REVER","APTO","6","Erro inevitável"],"ans":1,"why":"A condição 7>=6 é verdadeira; a função SE retorna o primeiro resultado.","topic":"Calc · SE","points":0.5,"visual":"sheet2","source":null},{"type":"mc","q":"Em uma planilha, deseja-se copiar a fórmula `=B2*$F$1` para a linha seguinte. Qual referência permanece FIXA?","options":["B2","F1 marcada como $F$1","As duas referências mudam","Nenhuma referência"],"ans":1,"why":"Os cifrões fixam coluna F e linha 1, enquanto B2 é relativa.","topic":"Calc · referências","points":0.5,"visual":null,"source":null},{"type":"mc","q":"Em uma tabela, `=CONT.SE(A2:A20;\"Sim\")` realiza qual operação?","options":["Conta células com o texto “Sim” no intervalo.","Soma todos os números do intervalo.","Converte texto em imagem.","Cria gráfico automático sem seleção."],"ans":0,"why":"CONT.SE conta células que atendem ao critério.","topic":"Calc · CONT.SE","points":0.5,"visual":null,"source":null},{"type":"mc","q":"Uma equipe precisa montar um mapa mental. Qual estrutura traduz melhor a lógica de um mapa mental?","options":["Uma sequência sem conexões entre assuntos.","Um tema central ligado a ramos e subtemas.","Somente tabelas de números.","Um arquivo executável sem tópicos."],"ans":1,"why":"Mapas mentais organizam visualmente ideia central, ramificações e relações.","topic":"Mapas mentais","points":0.5,"visual":"mind","source":null},{"type":"mc","q":"Qual é a função principal de um certificado digital numa comunicação com criptografia de chave pública?","options":["Atestar o vínculo de uma chave pública com uma identidade, conforme a autoridade emissora.","Substituir todas as senhas e antivírus.","Divulgar publicamente a chave privada.","Impedir toda e qualquer interceptação física."],"ans":0,"why":"O certificado vincula identidade e chave pública por mecanismos de confiança.","topic":"Segurança · certificados","points":0.5,"visual":null,"source":null},{"type":"mc","q":"Qual afirmação sobre serviços de nuvem está INCORRETA?","options":["Facilitam acesso e colaboração em diferentes dispositivos.","Dependem de autorização e conexão quando o acesso é remoto.","Garantem que dados nunca sejam perdidos, em qualquer hipótese.","Podem oferecer edição compartilhada e histórico de versões."],"ans":2,"why":"A nuvem não garante risco zero; disponibilidade e segurança exigem políticas, backups e controles.","topic":"Nuvem","points":0.5,"visual":null,"source":null},{"type":"mc","q":"Em uma rede institucional, o firewall atua principalmente para:","options":["Controlar tráfego conforme regras e políticas de segurança.","Substituir treinamento sobre phishing.","Corrigir ortografia dos documentos.","Impedir golpes por telefone automaticamente."],"ans":0,"why":"Firewalls filtram comunicações de rede com base em regras.","topic":"Segurança · firewall","points":0.5,"visual":"shield","source":null},{"type":"mc","q":"Quando um antivírus envia um arquivo suspeito para quarentena, a função típica é:","options":["Publicar o arquivo para a internet.","Isolar o arquivo para reduzir risco até análise ou remoção.","Executar o arquivo para acelerar o sistema.","Garantir que todos os demais dispositivos já estão imunes."],"ans":1,"why":"A quarentena isola conteúdo suspeito, não substitui a investigação.","topic":"Segurança · antivírus","points":0.5,"visual":null,"source":null},{"type":"tf","q":"É correto afirmar: ao exportar uma planilha para PDF, o Calc obrigatoriamente exporta todas as páginas, sem opções de seleção.","ans":false,"why":"Configurações de impressão/exportação podem alterar intervalo e páginas; “sempre” torna a frase falsa.","topic":"Calc · exportação","points":0.5},{"type":"tf","q":"Criptografia é utilizada para proteger a confidencialidade de informações conforme mecanismos e chaves adequados.","ans":true,"why":"Criptografia codifica dados para impedir leitura por quem não possui meios autorizados de decifrá-los.","topic":"Criptografia","points":0.5},{"type":"tf","q":"Wikis podem permitir edição colaborativa por usuários autorizados, com controle de histórico de versões.","ans":true,"why":"Edição coletiva e histórico são características comuns das wikis.","topic":"Web 2.0","points":0.5},{"type":"tf","q":"Um firewall torna desnecessários antivírus, atualizações e cuidados contra engenharia social.","ans":false,"why":"Firewall cobre parte dos riscos, mas não substitui defesa em camadas.","topic":"Segurança","points":0.5}],"source":[["Disciplina CEDERJ","https://graduacao.cederj.edu.br/course/view.php?id=1092"],["Revisão AP2","https://graduacao.cederj.edu.br/course/section.php?id=26262"],["Prova reproduzida 2025.1 (terceiro)","https://www.passeidireto.com/arquivo/188204488/ap-2-2025-01-inf-instr-int-inf-inf-bas"]]},{"id":"port","name":"Português Instrumental","tag":"Texto, interpretação e escrita","date":"Domingo · 18 de outubro","period":"Faixa do calendário: 09h30–12h","short":"Português","aulas":"Volume 1, aulas 5–14; volume 2, aulas 19–24; complementos","pedagogy":"5 objetivas + 3 discursivas, desenho de treino; formato 2026.2 não publicado.","duration":70,"questions":[{"type":"mc","q":"A ideia central do Texto A é:","options":["A simples existência de tecnologia resolve todos os atrasos.","A clareza das informações enviadas melhora a triagem dos pedidos, embora não elimine problemas.","Moradores devem deixar de comunicar problemas de iluminação.","A equipe decidiu parar de atender solicitações."],"ans":1,"why":"O texto sustenta melhoria na organização, mas admite atrasos persistentes.","topic":"Interpretação de texto","points":1,"visual":"texts","source":null},{"type":"mc","q":"No trecho “A medida facilitou o registro das solicitações, MAS a equipe...”, a conjunção destacada estabelece relação de:","options":["Causa","Condição","Oposição / contraste","Conclusão"],"ans":2,"why":"“Mas” introduz contraste entre facilidade do registro e dificuldade na análise.","topic":"Conectivos","points":1,"visual":null,"source":null},{"type":"mc","q":"No Texto A, a expressão “A mudança” retoma principalmente:","options":["A criação do centro comunitário.","A orientação para indicar dados concretos de localização e horário.","O aumento de mensagens sem referência.","O encerramento do canal digital."],"ans":1,"why":"O termo retoma a orientação introduzida no período anterior, promovendo coesão referencial.","topic":"Coesão referencial","points":1,"visual":null,"source":null},{"type":"mc","q":"Assinale a alternativa com concordância verbal adequada à norma-padrão.","options":["Haviam muitas solicitações sem endereço.","Fazem dois dias que a equipe publicou o aviso.","Existiam registros incompletos no sistema.","Foi encontrado várias mensagens sem referência."],"ans":2,"why":"“Existiam” concorda com “registros”. Impessoais “haver” e “fazer”, no sentido de existência e tempo, ficam no singular.","topic":"Concordância","points":1,"visual":null,"source":null},{"type":"mc","q":"Assinale o período com pontuação e regência adequadas.","options":["A equipe informou aos moradores, que o canal receberia sugestões.","Os técnicos se referiram às informações que estavam incompletas.","A administração assistiu o debate e obedeceu as regras.","No entanto a equipe, manteve o prazo informado."],"ans":1,"why":"“Referir-se a” + artigo “as” forma “às”. As outras apresentam vírgula indevida ou regência inadequada.","topic":"Regência e pontuação","points":1,"visual":null,"source":null},{"type":"short","q":"Reescreva, com suas palavras, a ideia do último período do Texto A, preservando o sentido e mantendo registro formal.","example":"Ex.: Embora continuassem ocorrendo atrasos, a orientação deixou os registros mais precisos e ajudou a definir a ordem de atendimento.","criteria":["Manter a oposição entre melhora e atrasos persistentes.","Usar vocabulário próprio, sem copiar literalmente.","Preservar clareza e correção."],"topic":"Paráfrase","points":1.5,"visual":null},{"type":"short","q":"Compare os Textos A e B: identifique UMA ideia que aproxima os textos e UMA diferença de enfoque.","example":"Semelhança: ambos defendem que o uso de tecnologia depende de comunicação clara. Diferença: A descreve um caso concreto de melhoria no registro de pedidos; B analisa critérios institucionais, transparência e devolutiva.","criteria":["Apontar a ideia comum da comunicação clara.","Contrastar exemplo prático (A) com reflexão sobre transparência/devolutiva (B)."],"topic":"Comparação de textos","points":1.5,"visual":null},{"type":"short","q":"Reescreva o comunicado a seguir segundo a norma-padrão, corrigindo concordância, pontuação e clareza: “A equipe informa que houveram reclamações, porém as resposta não foi enviadas porque faltou dados. Preencha direito.”","example":"Ex.: A equipe informa que houve reclamações, porém as respostas não foram enviadas porque faltaram dados para a análise. Solicitamos que os registros sejam preenchidos com as informações necessárias.","criteria":["Corrigir “houveram” por “houve” e ajustar a concordância de “as respostas não foram enviadas”.","Corrigir “faltou dados” por “faltaram dados”.","Empregar pontuação adequada e linguagem formal/respeitosa.","Manter o sentido original."],"topic":"Reescrita · gramática contextualizada","points":2,"visual":null}],"source":[["Disciplina CEDERJ/UNIRIO","https://graduacao.cederj.edu.br/course/view.php?id=374"],["Guia da disciplina","https://graduacao.cederj.edu.br/mod/resource/view.php?id=41508"],["Volume público CECIERJ","https://canal.cecierj.edu.br/recurso/15238"]],"passages":[["Texto A · Comunicado comunitário","No início do semestre, o centro comunitário abriu um canal digital para que moradores relatassem problemas de iluminação nas ruas. A medida facilitou o registro das solicitações, mas a equipe responsável percebeu que mensagens sem referência ao local dificultavam a análise. Por isso, passou a orientar os participantes a indicar rua, ponto de referência e horário aproximado do problema. A mudança não eliminou todos os atrasos; ainda assim, tornou as informações mais claras e permitiu organizar prioridades de atendimento."],["Texto B · Transparência e participação","Um canal de participação não funciona apenas porque existe uma ferramenta de envio. Para produzir decisões transparentes, é necessário explicar quais dados serão coletados, como serão utilizados e quais critérios orientam a resposta. Quando a comunicação é clara, a tecnologia pode aproximar instituições e cidadãos. Sem devolutiva, porém, o canal tende a se transformar em um depósito de mensagens."]]}];

ht=\"45\" rx=\"12\" fill=\"#2b4e66\"/><text x=\"478\" y=\"72\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">Rede interna<\/text><\/svg>","texts":"<svg viewBox=\"0 0 600 107\" role=\"img\" aria-label=\"Dois documentos para comparação de conteúdo e interpretação\"><g fill=\"#193c55\" stroke=\"#70c8d6\"><rect x=\"53\" y=\"5\" width=\"214\" height=\"98\" rx=\"10\"/><rect x=\"332\" y=\"5\" width=\"214\" height=\"98\" rx=\"10\"/><\/g><g fill=\"#d6f0f8\" font-size=\"16\" font-weight=\"bold\"><text x=\"75\" y=\"30\">TEXTO A<\/text><text x=\"355\" y=\"30\">TEXTO B<\/text><\/g><path d=\"M75 47h150m-150 13h142m-142 13h118M354 47h165m-165 13h122m-122 13h143\" stroke=\"#6795a4\" stroke-width=\"5\" stroke-linecap=\"round\"/><\/svg>"};
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={current:null,index:0,answers:{},flags:{},submitted:{},self:{},timer:{},study:{},reveal:{},view:'home'};
const STORE='ap2_cederj_public_v7_'+EXAMS.map(e=>e.id).join('_');
try{const v=JSON.parse(localStorage.getItem(STORE)||'null');if(v&&typeof v==='object')state={...state,...v,view:'home'};}catch(e){}
function persist(){try{localStorage.setItem(STORE,JSON.stringify({...state,view:'home'}));}catch(e){}}
function examById(id){return EXAMS.find(e=>e.id===id)}
function scoped(id,k){if(!state[k][id])state[k][id]={};return state[k][id];}
function val(e,i){return scoped(e.id,'answers')[i];}
function isAnswered(q,v){return q.type==='short'?String(v??'').trim().length>0:q.type==='multi'?Array.isArray(v)&&v.length>0:(v!==undefined&&v!==null&&v!=='');}
function countAnswered(e){return e.questions.filter((q,i)=>isAnswered(q,val(e,i))).length;}
function isDone(e){return !!state.submitted[e.id]}
function score(e){let obj=0,manual=0,ungraded=0; e.questions.forEach((q,i)=>{let a=val(e,i);if(q.type==='short'){if(state.self[e.id]?.[i]===undefined)ungraded+=q.points;else manual+=q.points*state.self[e.id][i];}else if(correct(q,a))obj+=q.points;});return {obj,manual,total:obj+manual,pending:ungraded};}
function correct(q,a){if(q.type==='multi')return Array.isArray(a)&&a.length===q.ans.length&&q.ans.every(x=>a.includes(x));if(q.type==='tf')return typeof a==='boolean'&&q.ans===a;if(q.type==='short')return null;return typeof a==='number'&&a===q.ans;}
function topicTag(q){return `<span class="topic">${esc(q.topic)}</span>`;}
function progress(e){return Math.round(countAnswered(e)*100/e.questions.length)}
function examTint(e){return e.id==='ead'?'#38d9bf':e.id==='info'?'#70c7ff':'#baabff'}
function setTint(e){document.documentElement.style.setProperty('--accent',e?examTint(e):'#38d9bf');}
function svg(name){return name&&VIS[name]?`<div class="vis">${VIS[name]}</div>`:'';}
function hero(){return `<section class="hero"><div class="eyebrow">Laboratório de provas · 2026.2</div><h1>AP2. Três provas.<br><span style="color:#8decdb">Um treino de verdade.</span></h1><p>Questões autorais baseadas no programa recuperado, com materiais oficiais e estrutura histórica de Informática. Treine, marque dúvidas e revise cada erro.</p><div class="chips"><span class="pill">30+ itens de prova</span><span class="pill">Correção e critérios de escrita</span><span class="pill">100% offline</span></div></section>`;}
function home(){setTint(null);state.view='home';state.current=null;persist();let cards=EXAMS.map((e,i)=>{let n=countAnswered(e),done=isDone(e),sc=done?score(e):null;return `<button class="examcard" onclick="openExam('${e.id}')" style="--accent:${examTint(e)}"><span class="num">CADERNO 0${i+1} · ${esc(e.short.toUpperCase())}</span><strong>${esc(e.name)}</strong><small>${esc(e.date)}<br>${esc(e.period)}</small><span class="small">${e.questions.length} respostas · 10 pontos</span><div class="progress-track"><span class="fill" style="width:${progress(e)}%"></span></div><span class="go">${done?'Ver correção · '+sc.total.toFixed(1)+'/10':n?'Continuar de onde parou →':'Iniciar simulado →'}</span></button>`;}).join('');app.innerHTML=hero()+`<section class="notice"><b>Transparência:</b> não são questões oficiais inéditas nem uma previsão garantida. O padrão de 2026.2 não foi publicado; a estrutura de Informática reproduz o número de grupos observado em 2025.1.</section><div class="master-quick"><button class="master-link acc" onclick="openMasterLab(2)">▦ Laboratório Calc</button><button class="master-link" onclick="openMasterCourse('info')">✦ Aulas guiadas</button><button class="master-link" onclick="openMasterDashboard()">▤ Diagnóstico</button><button class="master-link" onclick="masterShare()">↗ Compartilhar</button></div><div class="cards">${cards}</div><section class="panel"><h2>Como usar</h2><p class="muted">Selecione uma matéria e resolva tudo sem olhar o gabarito. Ao entregar, as respostas objetivas são corrigidas automaticamente; nas discursivas, compare sua resposta ao espelho e escolha sua pontuação. Você também pode habilitar <b>Modo estudo</b> para ver a explicação depois de cada questão.</p><div class="chips"><span class="pill">Respostas salvas neste navegador, quando permitido</span><span class="pill">Cronômetro opcional de estudo</span><span class="pill">Acessível no celular</span></div></section>`;}
function openExam(id){const e=examById(id);if(!e)return;state.current=id;state.index=0;state.view=isDone(e)?'results':'exam';setTint(e);persist();render();window.scrollTo({top:0,behavior:'smooth'});}
function getQTitle(e,i){if(e.id==='info'){let g=i<2?1:i<6?2:i<10?3:i<14?4:5;let start=[0,0,2,6,10,14][g];return `Questão ${g} · item ${i-start+1}`;}return `Questão ${String(i+1).padStart(2,'0')}`;}
function tabNav(e){return `<div class="tabs" role="navigation" aria-label="Alternar provas"><button class="tab" onclick="home()">⌂ Início</button><button class="tab" onclick="openMasterLab(2)">▦ Calc</button><button class="tab" onclick="openMasterCourse('info')">✦ Curso</button><button class="tab" onclick="openMasterDashboard()">▤ Diagnóstico</button>${EXAMS.map(x=>`<button class="tab ${x.id===e.id?'active':''}" onclick="openExam('${x.id}')">${esc(x.short)}</button>`).join('')}</div>`;}
function itemWidget(q,a,i,e){if(q.type==='short')return `<p class="helptxt">Resposta discursiva. Desenvolva a resposta como na prova; a avaliação não usa inteligência artificial nem finge corrigir texto livre com precisão.</p><textarea class="essay" id="essay" aria-label="Resposta discursiva" placeholder="Digite sua resposta aqui..." ${isDone(e)?'readonly':''}>${esc(a??'')}</textarea>`;
 if(q.type==='tf')return [true,false].map(v=>{let selected=a===v,grading=isDone(e)||(state.study[e.id]&&state.reveal[e.id]?.[i]);let type=grading?(v===q.ans?'good':selected?'bad':''):'';return `<label class="opt ${selected?'selected':''} ${type}"><input type="radio" name="choice" value="${v}" ${selected?'checked':''} ${isDone(e)?'disabled':''}><span>${v?'Verdadeiro':'Falso'}</span></label>`;}).join('');
 let choices=q.options.map((o,n)=>{let selected=q.type==='multi'?Array.isArray(a)&&a.includes(n):a===n;let grading=isDone(e)||(state.study[e.id]&&state.reveal[e.id]?.[i]);let good=q.type==='multi'?q.ans.includes(n):q.ans===n;return `<label class="opt ${selected?'selected':''} ${grading?(good?'good':selected?'bad':''):''}"><input type="${q.type==='multi'?'checkbox':'radio'}" name="choice" value="${n}" ${selected?'checked':''} ${isDone(e)?'disabled':''}><span><b>${String.fromCharCode(65+n)}.</b> ${esc(o)}</span></label>`;});return choices.join('')+(q.type==='multi'?'<p class="legend">Marque todas as corretas. Pontuação integral apenas com o conjunto completo.</p>':'');
}
function expected(q){if(q.type==='short')return esc(q.example);if(q.type==='tf')return q.ans?'Verdadeiro':'Falso';if(q.type==='multi')return q.ans.map(n=>String.fromCharCode(65+n)).join(', ');return String.fromCharCode(65+q.ans);}
function explanation(q,a,e,i){if(q.type==='short')return `<div class="ansbox"><strong>Espelho da resposta</strong><p>${esc(q.example)}</p><div class="small muted">Critérios de correção:</div>${q.criteria.map(t=>`<div class="criterion small">✓ ${esc(t)}</div>`).join('')}</div>`;
 let ok=correct(q,a);return `<div class="ansbox ${ok?'':'bad'}"><strong>${ok?'Resposta correta':'Resposta a revisar'} · Gabarito: ${expected(q)}</strong><p>${esc(q.why)}</p><small class="muted">${ok?'+'+q.points.toLocaleString('pt-BR'):'0'} de ${q.points.toLocaleString('pt-BR')} ponto(s)</small></div>`;}
function passages(e){return (e.passages||[]).map(([h,t])=>`<section class="passage"><h3>${esc(h)}</h3><p>${esc(t)}</p></section>`).join('');}
function renderExam(){const e=examById(state.current),i=state.index,q=e.questions[i],a=val(e,i),n=countAnswered(e),done=isDone(e),now=state.timer[e.id]??e.duration*60;setTint(e);document.title='AP2 · '+e.short+' · CEDERJ';const dots=e.questions.map((x,j)=>`<button class="nbtn ${isAnswered(x,val(e,j))?'filled':''} ${j===i?'current':''} ${state.flags[e.id]?.[j]?'flagged':''}" onclick="goQ(${j})" aria-label="Ir à questão ${j+1}">${j+1}</button>`).join('');let shown=done||state.study[e.id]&&state.reveal[e.id]?.[i];
app.innerHTML=tabNav(e)+`<div class="panel"><div class="headingbar"><div><span class="eyebrow">${esc(e.tag)}</span><h2>${esc(e.name)}</h2><div class="meta"><span>${esc(e.date)}</span><span>${esc(e.period)}</span></div></div><button class="btn ghost" onclick="home()">← Voltar ao painel</button></div><p class="small muted">${esc(e.aulas)}</p><div class="note">${esc(e.pedagogy)} Tempo sugerido abaixo é apenas cronômetro de treino, não a duração oficial da AP.</div><div class="bar"><span class="small stat"><b>${n}/${e.questions.length}</b> respondidas · <b id="clock">${clock(now)}</b></span><div class="actions"><button class="btn ghost" id="timerBtn" onclick="toggleTimer()">${state.running===e.id?'Pausar':'Iniciar'} cronômetro</button><button class="btn ghost" onclick="toggleStudy()">${state.study[e.id]?'✓ Modo estudo':'Modo estudo'}</button></div></div><div class="progress-track"><span class="fill" style="width:${progress(e)}%"></span></div></div><section class="panel"><div class="qtop"><span class="qnum">${getQTitle(e,i)} · ${q.points.toLocaleString('pt-BR')} pt</span>${topicTag(q)}</div>${i===0&&e.passages?passages(e):''}${svg(q.visual)}<div class="prompt">${esc(q.q).replace(/`([^`]+)`/g,'<span class="kbd">$1</span>')}</div>${itemWidget(q,a,i,e)}${shown?explanation(q,a,e,i):''}<div class="bar" style="margin-top:17px"><button class="btn ghost" onclick="toggleFlag()">${state.flags[e.id]?.[i]?'★ Marcada para revisão':'☆ Marcar dúvida'}</button>${!done&&state.study[e.id]?`<button class="btn" onclick="revealAnswer()">Conferir esta resposta</button>`:''}</div><div class="nextrow"><button class="btn ghost" onclick="goQ(${Math.max(0,i-1)})" ${i===0?'disabled':''}>← Anterior</button>${i===e.questions.length-1?`<button class="btn primary" onclick="${done?'showResults()':'submitExam()'}">${done?'Resultado':'Entregar prova'} →</button>`:`<button class="btn primary" onclick="goQ(${i+1})">Próxima →</button>`}</div></section><div class="panel"><div class="bar"><b>Navegação entre questões</b><span class="legend">Borda verde = respondida · estrela = dúvida</span></div><div class="numberboard">${dots}</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="${done?'showResults()':'submitExam()'}">${done?'Ver nota e revisão':'Finalizar e corrigir'}</button><button class="btn danger" onclick="resetExam()">Reiniciar apenas esta matéria</button></div></div>`;
const essay=$('#essay');if(essay&&!done)essay.addEventListener('input',ev=>{scoped(e.id,'answers')[i]=ev.target.value;persist();});
document.querySelectorAll('input[name=choice]').forEach(el=>el.addEventListener('change',ev=>{if(done)return;let store=scoped(e.id,'answers');if(q.type==='multi'){let arr=[...(store[i]||[])];let v=Number(ev.target.value);if(ev.target.checked&&!arr.includes(v))arr.push(v);if(!ev.target.checked)arr=arr.filter(x=>x!==v);store[i]=arr.sort((x,y)=>x-y);}else if(q.type==='tf'){store[i]=ev.target.value==='true';}else store[i]=Number(ev.target.value);persist();renderExam();}));}
function clock(t){let m=Math.floor(Math.max(t,0)/60);let s=Math.max(t,0)%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function goQ(n){const e=examById(state.current);state.index=Math.min(Math.max(n,0),e.questions.length-1);persist();renderExam();window.scrollTo({top:0,behavior:'smooth'});}
function toggleFlag(){const m=scoped(state.current,'flags');m[state.index]=!m[state.index];persist();renderExam();}
function toggleStudy(){const id=state.current;state.study[id]=!state.study[id];persist();renderExam();}
function revealAnswer(){const id=state.current;scoped(id,'reveal')[state.index]=true;persist();renderExam();}
function toggleTimer(){const id=state.current;if(state.running===id)state.running=null;else state.running=id;persist();renderExam();}
function submitExam(){const e=examById(state.current);const missing=e.questions.length-countAnswered(e);if(missing&&!confirm(`Você deixou ${missing} questão(ões) sem resposta. Entregar mesmo assim?`))return;if(!confirm('Finalizar este simulado e liberar o gabarito?'))return;state.running=null;state.submitted[e.id]=true;state.view='results';persist();render();window.scrollTo({top:0,behavior:'smooth'});}
function showResults(){state.view='results';persist();render();window.scrollTo({top:0,behavior:'smooth'});}
function reviewEssay(idx,value){scoped(state.current,'self')[idx]=value;persist();renderResults();}
function resultRow(e,q,i){let a=val(e,i),manual=q.type==='short',s=manual?(state.self[e.id]?.[i]):null,ok=!manual&&correct(q,a);let stat=manual?(s===undefined?'Autoavaliação pendente':s===1?'Autocorreção integral':s===.5?'Autocorreção parcial':'Sem pontos'):(ok?'Acertou':'Errou');let chosen=q.type==='short'?(String(a??'').trim()?'Resposta escrita':'Em branco'):q.type==='tf'?(typeof a==='boolean'?(a?'V':'F'):'Em branco'):q.type==='multi'?Array.isArray(a)&&a.length?a.map(n=>String.fromCharCode(65+n)).join(', '):'Em branco':typeof a==='number'?String.fromCharCode(65+a):'Em branco';return `<details class="review-item"><summary>${getQTitle(e,i)} · ${stat} · ${q.points} pt</summary><div class="small muted" style="margin:8px 0">Sua resposta: ${esc(chosen)}</div><div class="small">${esc(q.q)}</div>${manual?`<div class="ansbox"><b>Modelo:</b> ${esc(q.example)}<div style="margin-top:9px">${q.criteria.map(c=>`<div class="criterion small">• ${esc(c)}</div>`).join('')}</div></div><p class="small">Leia sua própria resposta, compare com os critérios e marque uma pontuação. Sem essa escolha, a nota exibida é parcial.</p><div class="reviewbuttons">${[[0,'0%'],[.5,'50%'],[1,'100%']].map(([v,l])=>`<button class="btn ${s===v?'active':''}" onclick="reviewEssay(${i},${v})">${l}</button>`).join('')}</div>`:`<div class="ansbox ${ok?'':'bad'}"><b>Gabarito: ${expected(q)}</b><p>${esc(q.why)}</p></div>`}<div class="actions" style="margin-top:10px"><button class="btn ghost" onclick="openMasterLessonFromTopic('${e.id}',${i})">Abrir aula deste tema →</button></div></details>`;}
function renderResults(){const e=examById(state.current),r=score(e),pending=e.questions.filter((q,i)=>q.type==='short'&&state.self[e.id]?.[i]===undefined).length;setTint(e);document.title='Correção AP2 · '+e.short;app.innerHTML=tabNav(e)+`<div class="hero"><div class="eyebrow">Correção do simulado · ${esc(e.short)}</div><h1>Seu resultado</h1><p>As objetivas têm gabarito automático. As discursivas dependem da sua comparação com o espelho de correção.</p><div class="chips"><span class="pill">${countAnswered(e)} de ${e.questions.length} respondidas</span><span class="pill">${pending} discursiva(s) sem avaliação</span><span class="pill">Máximo: 10 pontos</span></div></div><section class="panel"><div class="results"><div><div class="bigscore">${r.total.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2})}<span style="font-size:20px;color:#b7d3e7">/10</span></div><p class="small muted">${pending?'Nota parcial até avaliar os textos':'Nota do treino, com autoavaliação das discursivas'}</p></div><div><div class="meta"><span>Objetivas: <b>${r.obj.toLocaleString('pt-BR')}</b></span><span>Discursivas autoconferidas: <b>${r.manual.toLocaleString('pt-BR')}</b></span></div><div class="progress-track" style="margin:14px 0"><span class="fill" style="width:${r.total*10}%"></span></div><p class="small muted">A nota é somente diagnóstico de estudo e não equivale ao resultado da AP2 oficial.</p><div class="actions"><button class="btn primary" onclick="downloadReport()">Salvar relatório .txt</button><button class="btn ghost" onclick="window.print()">Imprimir resultado</button><button class="btn ghost" onclick="home()">Voltar ao painel</button></div></div></div></section><section class="panel"><h2>Aprenda com a correção</h2><p class="muted">Suas dificuldades serão transformadas em aulas e exercícios orientados.</p><div class="master-quick"><button class="master-link acc" onclick="openMasterCourse('${e.id}')">✦ Abrir aulas da disciplina</button>${e.id==='info'?'<button class="master-link" onclick="openMasterLab(2)">▦ Praticar Calc</button>':''}<button class="master-link" onclick="openMasterDashboard()">▤ Analisar erros</button></div></section><section class="panel"><h2>Espelho comentado</h2><p class="helptxt">Abra cada questão para conferir seu gabarito. Nas discursivas, selecione 0%, 50% ou 100% depois de avaliar os critérios.</p>${e.questions.map((q,i)=>resultRow(e,q,i)).join('')}</section><section class="panel"><h2>Fontes desta matéria</h2><div class="source-list">${e.source.map(([title,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)} ↗</a>`).join('')}</div><div class="actions" style="margin-top:18px"><button class="btn danger" onclick="resetExam()">Recomeçar este simulado</button></div></section>`;}
function downloadReport(){const e=examById(state.current),r=score(e);const rows=e.questions.map((q,i)=>{const v=val(e,i);return [getQTitle(e,i),q.topic,'Resposta: '+(q.type==='short'?String(v??''):q.type==='tf'?String(v??'em branco'):q.type==='multi'?JSON.stringify(v??[]):v===undefined?'em branco':String.fromCharCode(65+v)),'Gabarito: '+(q.type==='short'?q.example:expected(q)),q.type==='short'?'Autoavaliação: '+String(state.self[e.id]?.[i]??'pendente'):(correct(q,v)?'Correta':'Incorreta')].join(' | ')});let lines=['AP2 CEDERJ 2026.2 - SIMULADO AUTORAL',e.name,e.aulas,'NOTA PARCIAL/FONTE: '+r.total.toFixed(2)+' de 10. Não é nota oficial.','',...rows,'','Fontes',...e.source.map(([name,url])=>name+': '+url)].join('\n');let blob=new Blob([lines],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);let link=document.createElement('a');link.href=url;link.download='Resultado_AP2_'+e.id+'.txt';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}

function masterCloneInitial(index){masterWorkbook=index;masterCells={...MASTER_BOOKS[index].initial};masterSelected=index===4?'F2':'D2';masterRenderLab();}
function masterColNumber(s){let n=0;for(const c of s.replace(/\$/g,'').toUpperCase())n=n*26+c.charCodeAt(0)-64;return n;}
function masterA1(col,row){let c='';for(let x=col;x>0;x=Math.floor((x-1)/26))c=String.fromCharCode(65+(x-1)%26)+c;return c+row;}
function masterTokens(str){const s=String(str).trim();let i=0,o=[];while(i<s.length){if(/\s/.test(s[i])){i++;continue;}
  if(s[i]==='"'){let j=i+1,v='';while(j<s.length&&s[j]!=='"'){v+=s[j++];}if(j>=s.length)throw Error('#TEXTO');o.push({t:'str',v});i=j+1;continue;}
  let piece=s.slice(i),m;
  if((m=piece.match(/^(\$?[A-Za-z]{1,3}\$?\d{1,6})/))){o.push({t:'ref',v:m[1].toUpperCase()});i+=m[1].length;continue;}
  if((m=piece.match(/^(\d+(?:[.,]\d+)?%?)/))){let v=m[1];if(v.indexOf(',')>=0)v=v.replace(',','.');let n=parseFloat(v);if(v.endsWith('%'))n/=100;o.push({t:'num',v:n});i+=m[1].length;continue;}
  if((m=piece.match(/^([A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ_0-9.]*)/))){o.push({t:'name',v:m[1].toUpperCase()});i+=m[1].length;continue;}
  if((m=piece.match(/^(>=|<=|<>|[+\-*/^();:><=])/))){o.push({t:m[1],v:m[1]});i+=m[1].length;continue;}
  throw Error('#SINTAXE');
 }return o;}
function masterParse(src){const toks=masterTokens(src),at={i:0};const peek=()=>toks[at.i]?.t, take=t=>{if(peek()!==t)throw Error('#SINTAXE');return toks[at.i++];};
 function primary(){let t=peek();if(t==='num'||t==='str'){const v=toks[at.i++].v;return {t,v};}if(t==='ref'){let ref=take('ref').v;if(peek()===':'){take(':');return {t:'range',a:ref,b:take('ref').v};}return {t:'ref',v:ref};}if(t==='name'){const name=take('name').v;take('(');let args=[];if(peek()!==')'){args.push(expr());while(peek()===';'){take(';');args.push(expr());}}take(')');return {t:'call',name,args};}if(t==='('){take('(');const x=expr();take(')');return x;}if(t==='-'){take('-');return {t:'unary',op:'-',x:primary()};}if(t==='+'){take('+');return primary();}throw Error('#SINTAXE');}
 function power(){let x=primary();while(peek()==='^'){take('^');x={t:'bin',op:'^',a:x,b:primary()};}return x;}
 function mult(){let x=power();while(['*','/'].includes(peek())){const op=toks[at.i++].t;x={t:'bin',op,a:x,b:power()};}return x;}
 function add(){let x=mult();while(['+','-'].includes(peek())){const op=toks[at.i++].t;x={t:'bin',op,a:x,b:mult()};}return x;}
 function expr(){let x=add();while(['>','<','>=','<=','=','<>'].includes(peek())){const op=toks[at.i++].t;x={t:'bin',op,a:x,b:add()};}return x;}
 const ast=expr();if(at.i!==toks.length)throw Error('#SINTAXE');return ast;}
function masterCompute(ref,stack=[]){const cell=ref.replace(/\$/g,'').toUpperCase();if(stack.includes(cell))throw Error('#CIRCULAR');const raw=String(masterCells[cell]??'').trim();if(!raw)return 0;if(!raw.startsWith('=')){if(/^\d+(?:[.,]\d+)?%$/.test(raw))return parseFloat(raw.replace(',','.'))/100;if(/^[-+]?\d+(?:[.,]\d+)?$/.test(raw))return parseFloat(raw.replace(',','.'));return raw;}return masterEval(masterParse(raw.slice(1)),[...stack,cell]);}
function masterNumber(n){if(n===''||n===null||n===undefined)return 0;const v=Number(n);if(!Number.isFinite(v))throw Error('#VALOR');return v;}
function masterEval(ast,stack){if(ast.t==='num'||ast.t==='str')return ast.v;if(ast.t==='ref')return masterCompute(ast.v,stack);if(ast.t==='range'){const a=ast.a.replace(/\$/g,'').match(/^([A-Z]+)(\d+)$/),b=ast.b.replace(/\$/g,'').match(/^([A-Z]+)(\d+)$/);let out=[];if(!a||!b)throw Error('#REFERENCIA');for(let y=Number(a[2]);y<=Number(b[2]);y++){for(let x=masterColNumber(a[1]);x<=masterColNumber(b[1]);x++){if(out.length>=500)throw Error('#LIMITE');out.push(masterCompute(masterA1(x,y),stack));}}return out;}
 if(ast.t==='unary')return -masterNumber(masterEval(ast.x,stack));if(ast.t==='bin'){const a=masterEval(ast.a,stack),b=masterEval(ast.b,stack);if(['=','<>','>','<','>=','<='].includes(ast.op)){if(ast.op==='=')return a===b;if(ast.op==='<>')return a!==b;if(ast.op==='>')return a>b;if(ast.op==='<')return a<b;if(ast.op==='>=')return a>=b;return a<=b;}let x=masterNumber(a),y=masterNumber(b);if(ast.op==='+')return x+y;if(ast.op==='-')return x-y;if(ast.op==='*')return x*y;if(ast.op==='/'){if(y===0)throw Error('#DIV/0');return x/y;}return x**y;}
 if(ast.t==='call'){if(ast.name==='SE'){if(ast.args.length!==3)throw Error('#ARG');return masterEval(ast.args[masterEval(ast.args[0],stack)?1:2],stack);}if(ast.name==='E')return ast.args.every(x=>Boolean(masterEval(x,stack)));if(ast.name==='OU')return ast.args.some(x=>Boolean(masterEval(x,stack)));if(!['SOMA','MÉDIA','MEDIA','MÍNIMO','MINIMO','MÁXIMO','MAXIMO','CONT.SE'].includes(ast.name))throw Error('#FUNÇÃO');if(ast.name==='CONT.SE'){if(ast.args.length!==2)throw Error('#ARG');const list=masterEval(ast.args[0],stack);const crit=masterEval(ast.args[1],stack);return (Array.isArray(list)?list:[list]).filter(x=>String(x)===String(crit)).length;}const list=ast.args.flatMap(x=>{const a=masterEval(x,stack);return Array.isArray(a)?a:[a]}).filter(x=>typeof x==='number'&&!Number.isNaN(x));if(ast.name==='SOMA')return list.reduce((a,b)=>a+b,0);if(!list.length)throw Error('#DIV/0');if(ast.name==='MÉDIA'||ast.name==='MEDIA')return list.reduce((a,b)=>a+b,0)/list.length;if(ast.name==='MÍNIMO'||ast.name==='MINIMO')return Math.min(...list);return Math.max(...list);}
 throw Error('#SINTAXE');}
function masterFormat(value,ref){if(typeof value==='number'){if(Math.abs(value)<1e-10)value=0;if(!Number.isFinite(value))return '#VALOR';if((masterWorkbook===4&&/^F[2-5]$/.test(ref))||(masterWorkbook===2&&/^C[2-3]$/.test(ref)))return new Intl.NumberFormat('pt-BR',{style:'percent',maximumFractionDigits:2}).format(value);return new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2}).format(value);}return String(value);}
function masterDisplay(ref){try{return masterFormat(masterCompute(ref),ref);}catch(e){return e.message?.startsWith('#')?e.message:'#ERRO';}}
function openMasterLab(index){if(index!==undefined){masterWorkbook=index;masterCells={...MASTER_BOOKS[index].initial};masterSelected=index===4?'F2':'D2';}else if(!Object.keys(masterCells).length){masterCells={...MASTER_BOOKS[0].initial};}state.current='info';state.view='lab';masterRenderLab();window.scrollTo(0,0);}
function masterSelect(ref){masterSelected=ref;const row=document.querySelectorAll('.master-calc-cell');row.forEach(x=>x.classList.toggle('is-sel',x.dataset.cell===ref));const formula=document.getElementById('master-formula');if(formula)formula.value=masterCells[ref]??'';const label=document.getElementById('master-label');if(label)label.textContent=ref;}
function masterApplyEdit(){const inp=document.getElementById('master-formula');if(!inp)return;const raw=inp.value.trim();if(raw)masterCells[masterSelected]=raw;else delete masterCells[masterSelected];masterRenderLab();}
function masterNextCopy(){const src=masterSelected,parts=src.match(/^([A-Z]+)(\d+)$/);if(!parts||Number(parts[2])>=10)return;const dest=parts[1]+(Number(parts[2])+1);const raw=String(masterCells[src]??'');if(!raw.startsWith('=')){document.getElementById('master-lab-status').textContent='Selecione uma célula com fórmula para copiá-la.';return;}masterCells[dest]=raw.replace(/(\$?)([A-Z]{1,3})(\$?)(\d+)/g,(_,lockCol,col,lockRow,row)=>lockCol+col+lockRow+(lockRow?row:Number(row)+1));masterSelected=dest;masterRenderLab();}
function masterRenderLab(){state.current='info';state.view='lab';setTint(examById('info'));const b=MASTER_BOOKS[masterWorkbook];const cols=['A','B','C','D','E','F'];const hdr='<div class="master-calc-cell master-hdr">#</div>'+cols.map(c=>`<div class="master-calc-cell master-hdr">${c}</div>`).join('');let rows='';for(let r=1;r<=9;r++){rows+=`<div class="master-calc-cell master-hdr">${r}</div>`;for(const c of cols){let name=c+r,v=masterDisplay(name),err=String(v).startsWith('#');rows+=`<button class="master-calc-cell ${r===1?'is-head ':''}${name===masterSelected?'is-sel ':''}${err?'is-error':''}" data-cell="${name}" onclick="masterSelect('${name}')" title="${esc(name+': '+(masterCells[name]??''))}">${esc(v)}</button>`;}}
 app.innerHTML=tabNav(examById('info'))+`<section class="panel"><span class="eyebrow">Laboratório executável · Cálculos reais no navegador</span><h2>Calc Studio</h2><p class="muted">Selecione uma célula, altere o valor ou escreva uma fórmula. Os resultados mudam imediatamente. Recursos demonstrativos, não uma reprodução integral do LibreOffice.</p><nav class="master-course-nav" aria-label="Escolher aula de Calc">${MASTER_BOOKS.map((x,i)=>`<button onclick="masterCloneInitial(${i})" aria-current="${masterWorkbook===i}">${i+1}. ${esc(x.title)}</button>`).join('')}</nav><div class="master-lesson"><h3>${esc(b.title)}</h3><p>${esc(b.goal)}</p><span class="master-chip">Experimente</span><p style="margin-bottom:0">${esc(b.task)}</p></div><div class="master-formula-row"><label id="master-label" for="master-formula">${masterSelected}</label><input id="master-formula" spellcheck="false" autocomplete="off" aria-label="Conteúdo ou fórmula da célula" value="${esc(masterCells[masterSelected]??'')}"><button onclick="masterApplyEdit()">Aplicar ✓</button></div><div id="master-lab-status" class="master-small" aria-live="polite">Células em verde têm cabeçalhos. Toque em qualquer célula para editar.</div><div class="master-grid-wrap"><div class="master-calc-grid">${hdr+rows}</div></div><div class="master-actions"><button onclick="masterNextCopy()">⇣ Copiar fórmula para a linha abaixo</button><button class="secondary" onclick="masterCloneInitial(${masterWorkbook})">↻ Restaurar exercício</button><button class="secondary" onclick="openMasterCourse('info',${masterWorkbook})">Abrir aula passo a passo →</button></div><div class="master-error-note">O laboratório implementa SOMA, MÉDIA, MÍNIMO, MÁXIMO, SE, CONT.SE, E, OU e operadores básicos. Fórmulas avançadas e comportamento integral do Calc exigem o próprio LibreOffice. Cálculos não são enviados a servidores.</div></section>`;

function openMasterLessonFromTopic(sub,i){const e=examById(sub),q=e.questions[i],topic=(q.topic+' '+q.q).toLowerCase();let ix=0;if(sub==='info'){if(/malware|vírus|cript|firewall|segurança|antivírus|certificado|spyware|worm|ransomware|quarentena/.test(topic))ix=5;else if(/nuvem|web|google|mapa|colabor|wiki|rede social/.test(topic))ix=6;else if(/porcent|desconto|percentual/.test(topic))ix=2;else if(/referên|\$/.test(topic))ix=3;else if(/\bse\b|cont.se|lógica/.test(topic))ix=1;else ix=0;}else if(sub==='ead'){ix=/áudio|vídeo|mp3|youtube/.test(topic)?1:/drive|link|permiss/.test(topic)?2:0;}else{ix=/coerência|conectiv|pontua|orações|vírgula/.test(topic)?1:/citação|paráfrase|plágio|revis/.test(topic)?2:0;}openMasterCourse(sub,ix);}
function masterRenderCourse(){const e=examById(masterCourseSub),lessons=MASTER_LESSONS[masterCourseSub],l=lessons[masterLessonIndex];setTint(e);app.innerHTML=tabNav(e)+`<section class="panel"><span class="eyebrow">Professor particular · Aulas pós-correção</span><h2>Curso guiado · ${esc(e.name)}</h2><p class="muted">Roteiros pedagógicos elaborados para os assuntos do programa. Não é um chatbot conectado a inteligência artificial ao vivo.</p><nav class="master-course-nav" aria-label="Escolher uma aula">${lessons.map((x,i)=>`<button onclick="openMasterCourse('${masterCourseSub}',${i})" aria-current="${masterLessonIndex===i}">${i+1}. ${esc(x.title)}</button>`).join('')}</nav><div class="master-lesson-detail"><span class="eyebrow">AULA ${masterLessonIndex+1} DE ${lessons.length}</span><h3>${esc(l.title)}</h3>${l.tags?`<div class="master-small">${esc(l.tags)}</div>`:''}<p>${esc(l.intro)}</p><h3>Aprenda passo a passo</h3><ol>${l.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${l.lab!==undefined&&l.lab!==null?`<button class="btn primary" onclick="openMasterLab(${l.lab})">▦ Abrir prática no Calc Studio →</button>`:''}<h3 style="margin-top:22px">Teste a compreensão</h3><p>${esc(l.check)}</p><details class="review-item"><summary>Revelar explicação</summary><p>${esc(l.why)}</p></details></div><div class="nextrow"><button class="btn ghost" onclick="openMasterCourse('${masterCourseSub}',${Math.max(0,masterLessonIndex-1)})" ${masterLessonIndex===0?'disabled':''}>← Aula anterior</button><button class="btn primary" onclick="openMasterCourse('${masterCourseSub}',${Math.min(lessons.length-1,masterLessonIndex+1)})" ${masterLessonIndex===lessons.length-1?'disabled':''}>Próxima aula →</button></div></section>`;}

function masterRenderDashboard(){let parts=EXAMS.map(e=>{const answered=countAnswered(e),correctAnswered=e.questions.filter((q,i)=>q.type!=='short'&&isAnswered(q,val(e,i))&&correct(q,val(e,i))).length,objAnswered=e.questions.filter((q,i)=>q.type!=='short'&&isAnswered(q,val(e,i))).length,sc=isDone(e)?score(e):null;return `<div class="master-lesson"><h3>${esc(e.name)}</h3><div class="master-info"><div><strong>${answered}/${e.questions.length}</strong><small>Respostas preenchidas</small></div><div><strong>${objAnswered?Math.round(100*correctAnswered/objAnswered)+'%':'—'}</strong><small>Acerto em questões objetivas já respondidas</small></div><div><strong>${sc?sc.total.toFixed(1)+'/10':'—'}</strong><small>Nota após entrega ${sc&&sc.pending?'(parcial)':''}</small></div></div><div class="master-bars" style="margin-top:16px">${[...new Set(e.questions.map(q=>q.topic?.split('·')[0].trim()||'Geral'))].map(topic=>{let items=e.questions.map((q,i)=>({q,i})).filter(x=>(x.q.topic?.split('·')[0].trim()||'Geral')===topic&&x.q.type!=='short'&&isAnswered(x.q,val(e,x.i)));let n=items.length,hit=items.filter(x=>correct(x.q,val(e,x.i))).length,pct=n?Math.round(hit/n*100):0;return `<div><div class="barhead"><span class="master-small">${esc(topic)}</span><span class="master-small">${n?pct+'% ('+hit+'/'+n+')':'Sem dados'}</span></div><div class="track"><div class="fill" style="width:${n?pct:0}%;background:${pct<60?'#e09c58':'#43d4ae'}"></div></div></div>`;}).join('')}</div><div class="actions"><button class="btn primary" onclick="openExam('${e.id}')">Abrir prova →</button><button class="btn ghost" onclick="openMasterCourse('${e.id}')">Aulas de recuperação</button></div></div>`;}).join('');app.innerHTML=tabNav(examById('info'))+`<section class="panel"><span class="eyebrow">Diagnóstico sem promessas artificiais</span><h2>Painel de desempenho</h2><p class="muted">O painel usa apenas respostas realmente preenchidas neste navegador. Porcentagens com poucos itens são exploratórias. O percentual de acerto não é probabilidade de obter nota 7 ou 10 na prova oficial.</p></section>${parts}<section class="panel"><h2>Plano de preparação</h2><p>1. Resolver a prova de Informática inteira sem consultar gabarito.</p><p>2. Corrigir discursivas com a rubrica, sem presumir nota automática.</p><p>3. Estudar as áreas com menor acerto e repetir os exercícios com outros números.</p><p>4. Retomar EaD e Português nos cadernos independentes.</p><p class="master-source-para">Fonte curricular: <a class="master-link-text" href="https://graduacao.cederj.edu.br/course/view.php?id=1092" target="_blank" rel="noopener">CEDERJ · Informática</a>. O formato da AP2 2026.2 não foi confirmado.</p></section>`;}
